# Partner — Windows desktop build (partner-shell.exe + NSIS installer)
#
# Runs on the repo's SELF-HOSTED Windows runner ([self-hosted, Windows]).
# Runner prerequisites: Node 22, VS Build Tools 2022 (C++ workload; npm ci
# rebuilds the aliased better-sqlite3 AND cargo links against MSVC),
# WebView2. Steps use `shell: cmd` — the runner has no pwsh and its
# PowerShell execution policy is GPO-pinned.
#
# The build stages the shell's self-contained resources BEFORE `tauri build`
# (closing the resources-embedding open item from
# shell/src-tauri/README-windows.md): core bundle + vendored natives + web
# UI + skills catalog land under src-tauri/resources/**, which tauri embeds
# via bundle.resources. The produced partner-shell.exe spawns the core from
# resources — no PARTNER_CORE_BUNDLE env needed.
#
# tauri.conf sets createUpdaterArtifacts: true; signed updater artifacts need
# TAURI_SIGNING_PRIVATE_KEY (+ pubkey) in the environment. Until a signing
# cert/keys exist, if the bundler demands the key, gate the flag behind
# config/env (signed updates are env-gated per PLAN-M10 W6.3 anyway).
#
# Trigger: manual (Actions -> Windows build) or a v* tag.
name: windows-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Diagnostics (VS / vswhere / PS policy)
        run: |
          if exist "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" ("C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath) else (echo NO_VSWHERE)
          where cl 2>nul || echo NO_CL_ON_PATH
          exit /b 0

      - name: Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      - name: Setup Python 3.12 (node-gyp for the aliased native)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm deps + Tauri CLI (rebuilds the aliased native — MSVC)
        env:
          npm_config_msvs_version: '2022'
        run: npm ci

      - name: Build web UI
        run: npm run build -w web

      - name: Bundle core artifact (CJS, natives external)
        run: npx esbuild core/src/index.ts --bundle --platform=node --format=cjs --target=node18 --external:better-sqlite3 --external:@napi-rs/keyring --outfile=shell/artifacts/core-bundle.cjs

      - name: Vendor natives (win32 prebuilds; SQLCipher fork alias)
        run: npm install --prefix shell/artifacts better-sqlite3@npm:better-sqlite3-multiple-ciphers@^13.0.3 @napi-rs/keyring@2

      - name: Sidecar placeholder (renamed node, per Tauri triple)
        run: |
          for /f "delims=" %%i in ('where node') do @copy /y "%%i" shell\src-tauri\binaries\partner-core-x86_64-pc-windows-msvc.exe
          if not exist shell\src-tauri\binaries\partner-core-x86_64-pc-windows-msvc.exe (echo SIDECAR_COPY_FAILED & exit /b 1)

      - name: Stage shell resources (self-contained core bundle)
        run: |
          if not exist shell\src-tauri\resources mkdir shell\src-tauri\resources
          copy /y shell\artifacts\core-bundle.cjs shell\src-tauri\resources\core-bundle.cjs || (echo BUNDLE_COPY_FAILED & exit /b 1)
          if exist shell\src-tauri\resources\node_modules rmdir /s /q shell\src-tauri\resources\node_modules
          xcopy /e /i /y shell\artifacts\node_modules shell\src-tauri\resources\node_modules || (echo NODE_MODULES_COPY_FAILED & exit /b 1)
          if exist shell\src-tauri\resources\web-dist rmdir /s /q shell\src-tauri\resources\web-dist
          xcopy /e /i /y web\dist shell\src-tauri\resources\web-dist || (echo WEBDIST_COPY_FAILED & exit /b 1)
          if exist shell\src-tauri\resources\skills-catalog rmdir /s /q shell\src-tauri\resources\skills-catalog
          xcopy /e /i /y skills-catalog shell\src-tauri\resources\skills-catalog || (echo SKILLS_COPY_FAILED & exit /b 1)
          echo --- staged resources tree ---
          dir shell\src-tauri\resources
          dir /s /b shell\src-tauri\resources\core-bundle.cjs shell\src-tauri\resources\node_modules shell\src-tauri\resources\web-dist shell\src-tauri\resources\skills-catalog 2>nul | find /c "."
          echo --- end staged resources ---

      - name: Build + bundle (NSIS)
        run: |
          cd /d shell
          npx tauri build --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: partner-windows
          path: |
            shell/src-tauri/target/release/partner-shell.exe
            shell/src-tauri/target/release/bundle/nsis/*.exe
            shell/artifacts/core-bundle.cjs
          if-no-files-found: error
