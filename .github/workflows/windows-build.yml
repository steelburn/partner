# Partner — Windows desktop build (partner-shell.exe + NSIS installer)
#
# Runs on the repo's SELF-HOSTED Windows runner ([self-hosted, Windows]; a
# GitHub-hosted windows-latest has no Rust/VS control and previously blocked
# on RC.EXE — the committed icon set is now generated by the OFFICIAL
# `tauri icon` tool (multi-image .ico), which is the fix that icon resource
# needs). The runner must have: Rust (MSVC), VS Build Tools 2022 (C++),
# Node 22, WebView2, Git-bash on PATH (steps use `shell: bash` — the runner
# has no pwsh and its PowerShell execution policy blocks script steps).
#
# The build stages the shell's self-contained resources BEFORE `tauri build`
# (closing the resources-embedding open item from
# shell/src-tauri/README-windows.md): core bundle + vendored natives + web
# UI + skills catalog land under src-tauri/resources/**, which tauri embeds
# via bundle.resources. The produced partner-shell.exe spawns the core from
# resources — no PARTNER_CORE_BUNDLE env needed.
#
# tauri.conf sets createUpdaterArtifacts: true; signed updater artifacts need
# TAURI_SIGNING_PRIVATE_KEY (+ pubkey) in the environment. Until a signing
# cert/keys exist, if the bundler demands the key, gate the flag behind
# config/env (signed updates are env-gated per PLAN-M10 W6.3 anyway).
#
# Trigger: manual (Actions -> Windows build) or a v* tag.
name: windows-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      - name: Setup Python 3.12 (node-gyp fallback)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install npm deps + Tauri CLI
        run: npm ci

      - name: Build web UI
        run: npm run build -w web

      - name: Bundle core artifact (CJS, natives external)
        run: npx esbuild core/src/index.ts --bundle --platform=node --format=cjs --target=node18 --external:better-sqlite3 --external:@napi-rs/keyring --outfile=shell/artifacts/core-bundle.cjs

      - name: Vendor natives (win32 prebuilds; SQLCipher fork alias)
        run: npm install --prefix shell/artifacts better-sqlite3@npm:better-sqlite3-multiple-ciphers@^13.0.3 @napi-rs/keyring@2

      - name: Sidecar placeholder (renamed node, per Tauri triple)
        run: |
          mkdir -p shell/src-tauri/binaries
          cp "$(command -v node)" shell/src-tauri/binaries/partner-core-x86_64-pc-windows-msvc.exe

      - name: Stage shell resources (self-contained core bundle)
        run: |
          mkdir -p shell/src-tauri/resources shell/src-tauri/resources/node_modules shell/src-tauri/resources/web-dist
          cp shell/artifacts/core-bundle.cjs shell/src-tauri/resources/core-bundle.cjs
          rm -rf shell/src-tauri/resources/node_modules/*
          cp -r shell/artifacts/node_modules/. shell/src-tauri/resources/node_modules/
          rm -rf shell/src-tauri/resources/web-dist/*
          cp -r web/dist/. shell/src-tauri/resources/web-dist/
          rm -rf shell/src-tauri/resources/skills-catalog
          mkdir -p shell/src-tauri/resources/skills-catalog
          cp -r skills-catalog/. shell/src-tauri/resources/skills-catalog/

      - name: Build + bundle (NSIS)
        run: |
          cd shell
          npx tauri build --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: partner-windows
          path: |
            shell/src-tauri/target/release/partner-shell.exe
            shell/src-tauri/target/release/bundle/nsis/*.exe
            shell/artifacts/core-bundle.cjs
          if-no-files-found: error
