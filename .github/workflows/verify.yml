# Partner — full verification matrix (self-hosted runners)
#
# The milestone gate for this repo is: typecheck (shared/core/web/extension)
# + the full vitest matrix — root core suite, web suite, extension suite —
# green on BOTH platforms, because several behaviours genuinely differ:
#   * Linux runs the symlink path-escape tests (Windows without Developer
#     Mode skips them) and asserts the strict minimal-env skill guarantee.
#   * Windows exercises the PATH pinning, teardown/AV retry paths and the
#     drive-letter package-root handling.
#
# Runs on the repo's self-hosted runners by design. Runner prerequisites:
#   * Linux: Node 22, and python3 + make + g++ — better-sqlite3-multiple-
#     ciphers is BUILT FROM SOURCE here because its published linux-x64
#     prebuild requires GLIBC_2.33 (Ubuntu 22.04+); this runner's glibc is
#     older, so the native module must link against the runner's libc.
#   * Windows: Node 22 + Windows PowerShell 5.1 (the runner has no pwsh;
#     `shell: powershell` is used). Native modules use their win32
#     prebuilds.
#
# Trigger: push to master or manual (Actions -> Verify -> Run workflow).
name: verify

on:
  workflow_dispatch:
  push:
    branches: ["master"]

jobs:
  verify-linux:
    name: verify (linux)
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Native build tools (python3, make, g++)
        run: |
          if sudo -n true 2>/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3 make g++
          else
            echo "no passwordless sudo — ensure python3, make and g++ are on this runner"
            command -v python3 && command -v make && command -v g++ || exit 1
          fi
      - name: Install (natives built from source for this runner's glibc)
        env:
          # The fork's linux-x64 prebuild needs GLIBC_2.33; build against the
          # runner's own libc instead.
          npm_config_build_from_source: 'true'
        run: npm ci
      - name: Typecheck (shared, core, web, extension)
        run: npm run typecheck
      - name: Root suite (core + shared + e2e incl. M9 spawned-core e2e)
        run: npm test
      - name: Web suite
        run: npx vitest run --config web/vitest.config.ts
      - name: Extension suite
        run: npx vitest run --config extension/vitest.config.ts

  verify-windows:
    name: verify (windows)
    runs-on: [self-hosted, Windows]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck (shared, core, web, extension)
        run: npm run typecheck
      - name: Root suite (core + shared + e2e incl. M9 spawned-core e2e)
        run: npm test
      - name: Web suite
        run: npx vitest run --config web/vitest.config.ts
      - name: Extension suite
        run: npx vitest run --config extension/vitest.config.ts
