<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Partner</title>
    <style>
      /* Chrome chrome: neutral, minimal, no design tokens required. */
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 320px;
        margin: 0;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fbfbfb;
        color: #1c1c1c;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #232323;
          color: #e6e6e6;
        }
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid rgba(127, 127, 127, 0.25);
      }
      header h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        flex: 1;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #9a9a9a;
      }
      .dot.ok {
        background: #1f6f43;
      }
      .dot.bad {
        background: #b42318;
      }
      .dot.off {
        background: #6a6a6a;
      }
      section {
        padding: 10px 12px;
        border-bottom: 1px solid rgba(127, 127, 127, 0.2);
      }
      section:last-child {
        border-bottom: none;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #6a6a6a;
        margin: 0 0 6px;
      }
      p {
        margin: 4px 0;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
      }
      button {
        font: inherit;
        padding: 6px 10px;
        border: 1px solid #c9c9c9;
        border-radius: 6px;
        background: #ffffff;
        color: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #f0f0f0;
      }
      button:focus-visible {
        outline: 2px solid #1f6f43;
        outline-offset: 1px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.primary {
        background: #1f6f43;
        border-color: #1f6f43;
        color: #ffffff;
      }
      button.primary:hover:not(:disabled) {
        background: #195936;
      }
      a {
        color: #1f6f43;
      }
      code {
        font-size: 12px;
        background: rgba(127, 127, 127, 0.14);
        padding: 1px 5px;
        border-radius: 4px;
      }
      .muted {
        color: #6a6a6a;
      }
      .warn {
        color: #a15c00;
      }
      .danger {
        color: #b42318;
      }
      .reply {
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 160px;
        overflow: auto;
        background: rgba(127, 127, 127, 0.1);
        border-radius: 6px;
        padding: 6px 8px;
        margin-top: 6px;
      }
      .hidden {
        display: none;
      }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding: 8px 12px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="statusDot" class="dot off"></span>
      <h1>Partner</h1>
      <a id="openWeb" href="http://127.0.0.1:4390" target="_blank" rel="noreferrer">Open</a>
    </header>

    <section>
      <h2>Connection</h2>
      <p id="statusText">Checking the Partner core…</p>
      <div class="row">
        <button id="pairBtn" class="primary" type="button">Pair with core</button>
      </div>
      <p id="codeRow" class="hidden">Demo code: <code id="codeText"></code></p>
      <p id="manualRow" class="hidden">
        <label for="codeInput">Pairing code from the Partner desktop:</label>
        <input
          id="codeInput"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          placeholder="6-digit code"
          spellcheck="false"
        />
        <button id="submitPair" type="button" class="primary">Connect</button>
      </p>
    </section>

    <section>
      <h2>This page</h2>
      <p id="pageLine" class="muted">…</p>
      <div class="row">
        <button id="partnerBtn" type="button" disabled>Partner this page</button>
      </div>
      <p id="pageResult"></p>
      <div id="replyBox" class="reply hidden"></div>
    </section>

    <section>
      <h2>Scope for this site</h2>
      <p id="scopeLine" class="muted">…</p>
      <p id="blockedLine" class="hidden warn"></p>
      <p class="muted">
        Scope is managed in the Partner web UI — quick view only here.
        <a id="scopeLink" href="http://127.0.0.1:4390" target="_blank" rel="noreferrer">Change scope ↗</a>
      </p>
    </section>

    <footer>
      <span id="denyNote" class="hidden danger"></span>
    </footer>

    <script type="module" src="../dist/popup.js"></script>
  </body>
</html>
